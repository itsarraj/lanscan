[package]
name = "lanscan"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust ARP-based local network device discovery — no nmap/arp-scan binary required"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/lanscan"
readme = "README.md"
keywords = ["arp", "network", "discovery", "cli", "lan"]
categories = ["command-line-utilities"]

[lib]
name = "lanscan"
path = "src/lib.rs"

[[bin]]
name = "lanscan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
